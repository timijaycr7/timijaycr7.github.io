services:
  portfolio:
    build: .
    image: timilehin-portfolio:1.0
    ports:
      - "${PORTFOLIO_BIND:-127.0.0.1}:${PORTFOLIO_PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
